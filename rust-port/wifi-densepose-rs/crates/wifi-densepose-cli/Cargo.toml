[package]
name = "wifi-densepose-cli"
version.workspace = true
edition.workspace = true
description = "CLI for WiFi-DensePose"
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/wifi-densepose-cli"
keywords = ["wifi", "cli", "densepose", "disaster", "detection"]
categories = ["command-line-utilities", "science"]
readme = "README.md"

[[bin]]
name = "wifi-densepose"
path = "src/main.rs"

[features]
default = ["mat"]
# `mat` pulls in wifi-densepose-mat which transitively brings in openblas-src.
# Made optional so `--no-default-features` builds cleanly on Mac/Proxmox boxes
# that just want the `listen` subcommand without OpenBLAS toolchain set up.
mat = ["dep:wifi-densepose-mat"]

[dependencies]
# Internal crates (gated by the `mat` feature)
wifi-densepose-mat = { version = "0.3.0", path = "../wifi-densepose-mat", optional = true }

# CLI framework
clap = { version = "4.4", features = ["derive", "env", "cargo"] }

# Output formatting
colored = "2.1"
tabled = { version = "0.15", features = ["ansi"] }
indicatif = "0.17"
console = "0.15"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# `listen` subcommand: HTTP control to firmware + UDP receive + audio playback / WAV write.
# rustls to avoid system OpenSSL on macOS / Proxmox / dev boxes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
cpal = "0.15"
hound = "3.5"
ctrlc = "3.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.9"
